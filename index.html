<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Patties Recipe Box</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
 <main class="container py-5">
        <h1 class="mb-4">Perfect Patties Recipe Box</h1>

        <section class="mb-5">
            <h2>Find a recipe</h2>
            <label for="recipe-id" class="form-label">Recipe number (1 to 50)</label>
            <input type="number" id="recipe-id" class="form-control mb-2">
            <button id="get-btn" class="btn btn-dark mb-3">Get recipe</button>
            <p id="status"></p>
            <div id="recipe"></div>
        </section>

        <section>
            <h2>Add a dish</h2>
            <label for="dish-name" class="form-label">Dish name</label>
            <input type="text" id="dish-name" class="form-control mb-2">
            <button id="post-btn" class="btn btn-warning mb-3">Add it</button>
            <p id="post-status"></p>
            <div id="saved"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
